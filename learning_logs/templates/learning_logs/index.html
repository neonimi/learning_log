{% extends "learning_logs/base.html" %}

{% block content %}
<div class="jumbotron">
	<h1 class="display-4">学んだことを記録しよう</h1>
	
	<p class="lead">自分だけの学習ノートを作成して、学んだことをいつでも
		振り返れるようにしよう。<br>
		何か新しいことを学んだら、その内容を要約した記事を書こう。</p>
	
	{% if not user.is_authenticated %}
	<a class="btn btn-lg btn-primary" href="{% url 'users:register' %}"
		role="button">登録する &raquo;</a>
	{% else %}
	<a class="btn btn-lg btn-primary" href="{% url 'learning_logs:topic' %}">新しいトピックを作成しよう &raquo;</a>
	{% endif %}
</div>

{% endblock content%}
